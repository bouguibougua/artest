<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Escalier AR</title><link rel="stylesheet" href="style.css">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<script defer src="script.js"></script></head>
<body><div id="hud"><div id="status">Initialisation…</div><div id="details">Vérification des fichiers…</div><div class="buttons"><button id="restart">Recommencer</button><button id="pause">Pause</button><button id="debug">Diagnostic</button></div><div id="panel" hidden><label><input id="guide" type="checkbox"> Montrer le trajet</label><label>Décalage horizontal <input id="dx" type="range" min="-800" max="800" value="0"></label><label>Décalage vertical <input id="dy" type="range" min="-800" max="800" value="0"></label><label>Taille <input id="size" type="range" min="0.3" max="3" step="0.1" value="1"></label><label>Vitesse <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label><pre id="log"></pre></div></div>
<a-scene embedded vr-mode-ui="enabled:false" loading-screen="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true;alpha:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best">
<a-nft id="marker" type="nft" url="assets/escalier" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"><a-entity id="image-plane" rotation="-90 0 0"></a-entity></a-nft><a-entity camera></a-entity></a-scene></body></html>
