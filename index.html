<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Escalier — Petit bonhomme</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div id="loading" class="loading">Chargement de la caméra et du marqueur…</div>
  <div class="ui">
    <div id="status" class="status" role="status" aria-live="polite">Vise l’image des escaliers avec la caméra.</div>
    <div class="controls">
      <button id="restart" type="button">Recommencer</button>
      <button id="pause" type="button">Pause</button>
      <button id="settings-toggle" type="button">Réglages</button>
    </div>
    <section id="settings" class="settings" hidden>
      <p>Calibrage : les coordonnées sont exprimées en pixels de l’image de référence (1616 × 1540).</p>
      <label>Décalage X <input id="offset-x" type="range" min="-800" max="800" step="5" value="0"><output id="offset-x-value">0</output></label>
      <label>Décalage Y <input id="offset-y" type="range" min="-800" max="800" step="5" value="0"><output id="offset-y-value">0</output></label>
      <label>Échelle du parcours <input id="path-scale" type="range" min="0.1" max="2" step="0.05" value="1"><output id="path-scale-value">1</output></label>
      <label>Taille du bonhomme <input id="figure-scale" type="range" min="0.3" max="4" step="0.1" value="1"><output id="figure-scale-value">1</output></label>
      <label>Vitesse <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speed-value">1</output></label>
      <label><input id="flip-y" type="checkbox"> Inverser l’axe vertical</label>
      <label><input id="show-path" type="checkbox"> Afficher le tracé de calibrage</label>
      <button id="reset-settings" type="button">Réinitialiser les réglages</button>
    </section>
  </div>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    loading-screen="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    <a-nft id="image-marker" type="nft" url="assets/escalier" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-entity id="drawing-plane" rotation="-90 0 0"></a-entity>
    </a-nft>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
