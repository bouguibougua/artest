<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Escalier blanc animé — AR</title><link rel="stylesheet" href="style.css"><script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script><script defer src="script.js"></script></head>
<body><div id="hud"><div id="status">Chargement de la caméra…</div><div class="buttons"><button id="restart">Recommencer</button><button id="pause">Pause</button><button id="animation">Animation</button><button id="debug">Réglages</button></div><div id="panel" hidden><label>Décalage horizontal <input id="dx" type="range" min="-800" max="800" value="0"></label><label>Décalage vertical <input id="dy" type="range" min="-800" max="800" value="0"></label><label>Échelle <input id="size" type="range" min="0.3" max="2" value="1" step="0.05"></label><label>Vitesse <input id="speed" type="range" min="0.2" max="3" value="1" step="0.1"></label><label><input id="loop" type="checkbox" checked> Recommencer automatiquement</label><label><input id="preview" type="checkbox"> Mode test (animation sans détection)</label><pre id="log"></pre></div></div>
<a-scene embedded vr-mode-ui="enabled:false" loading-screen="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true;alpha:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best"><a-nft id="marker" type="nft" url="assets/escalier" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"></a-nft><a-entity camera></a-entity></a-scene></body></html>
